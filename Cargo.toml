# MyPLC workspace: the PLC engine, the standalone runtime and the IDE's Tauri app.
#   core/          myplc-core     compiler, runtime engine, I/O, protocol (no UI, no Tauri)
#   runtime/       myplc-runtime  the runtime process (depends on core)
#   ui/src-tauri/  my-plc-ide     the IDE's desktop shell (depends on core; runs the runtime)
[workspace]
members = ["core", "runtime", "ui/src-tauri"]
resolver = "2"

# Release profile for every member (Cargo only reads profiles from the workspace root).
# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
